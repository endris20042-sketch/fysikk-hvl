.formulalist{display:grid;gap:11px}.formula{padding:16px 18px}.formula header{padding:0 0 8px}.formula h3{color:var(--accent);margin:0}.formula .eq{font-size:20px;font-weight:800;letter-spacing:-.02em;color:#f7fbfe;margin:9px 0;overflow-wrap:anywhere}.formula p{font-size:13px;color:var(--muted);margin:0}.listcheck{padding:13px 0 0 18px;margin:0}.listcheck li{margin-bottom:8px;color:#d4e5eb}.library-item{padding:12px 15px;border:1px solid var(--line);border-radius:12px;background:#112736;margin-bottom:8px}.library-item summary{font-weight:750;font-size:15px;cursor:pointer;list-style:none}.library-item summary::before{content:'＋';margin-right:9px;color:var(--accent)}.library-item[open] summary::before{content:'−'}.library-item p{margin:10px 0 4px;font-size:14px}.library-item .mini-note{font-size:12px;color:var(--muted)}.search{display:block;width:100%;background:#102a3a;border:1px solid #3c5a67;color:var(--text);padding:12px 15px;border-radius:13px;margin:9px 0 14px}.search::placeholder{color:#83a0ad}.main-nav{position:fixed;z-index:5;bottom:0;left:0;right:0;background:#0a1c2bea;border-top:1px solid #2a4655;backdrop-filter:blur(12px);padding:10px max(16px,env(safe-area-inset-left)) calc(9px + env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-right))}.nav-content{max-width:790px;margin:auto;display:grid;grid-template-columns:repeat(4,1fr);gap:6px}.navbtn{display:flex;flex-direction:column;align-items:center;gap:4px;background:transparent;border:0;color:#9db4c0;border-radius:10px;padding:4px 3px 7px;font-size:11px;font-weight:740}.navbtn .i{font-size:19px}.navbtn.active{color:var(--accent);background:#173441}.settings-item{margin:0 0 13px;border:1px solid var(--line);background:#102635;padding:17px;border-radius:14px}.settings-item p{margin:6px 0 14px;color:var(--muted);font-size:13px}.setting-actions{display:flex;flex-wrap:wrap;gap:9px} .callout{background:#152c3a;border-left:3px solid var(--accent);padding:13px 16px;border-radius:8px;margin:14px 0;color:#e0eff <script>
const CARDS = [{"id":"c001","topic":"Enheter og metode","q":"Hva er SI-enheten for kraft?","a":"newton (N) = kg·m/s².","h":"Se kraft → tenk Newtons lover.","t":"kg er masse, ikke kraft."},{"id":"c002","topic":"Enheter og metode","q":"Hva er SI-enheten for arbeid og energi?","a":"joule (J) = N·m.","h":"Arbeid og energi har samme enhet.","t":"Ikke bland energi (J) og effekt (W)."},{"id":"c003","topic":"Enheter og metode","q":"Hva er SI-enheten for effekt?","a":"watt (W) = J/s.","h":"Effekt forteller hvor raskt energi overføres.","t":"En motor med høy effekt trenger ikke bruke mest energi totalt."},{"id":"c004","topic":"Enheter og metode","q":"Hvordan gjør du km/t om til m/s?","a":"Del på 3,6. For eksempel: 72 km/t = 20 m/s.","h":"Skriv enhet ved hvert mellomsteg.","t":"Ikke gang med 3,6 denne veien."},{"id":"c005","topic":"Enheter og metode","q":"Hvor mange meter er 1 km?","a":"1 km = 1000 m = 10³ m.","h":"kilo betyr 1000.","t":"Skriv 10³, ikke 10⁻³."},{"id":"c006","topic":"Enheter og metode","q":"Hvor mange joule er 1 kJ?","a":"1 kJ = 1000 J.","h":"kilo betyr 1000.","t":"Bruk joule i regnestykket hvis resten er SI."},{"id":"c007","topic":"Enheter og metode","q":"Hvor mange kg er 450 g?","a":"450 g = 0,450 kg.","h":"Del gram på 1000.","t":"m i F = mg må stå i kg."},{"id":"c008","topic":"Enheter og metode","q":"Hva gjør du før første formel i en fysikkoppgave?","a":"Skriv opp kjent, ukjent, enheter, og tegn situasjonen.","h":"Kjent → ukjent → prinsipp → regning → enhet.","t":"Ikke sett tall i en tilfeldig formel."},{"id":"c009","topic":"Enheter og metode","q":"Hvordan sjekker du om et svar er rimelig?","a":"Kontroller enhet, fortegn, størrelsesorden og fysisk mening.","h":"Kan svaret være negativt? Må det øke eller minke?","t":"Riktig tall med feil enhet er feil svar."},{"id":"c010","topic":"Enheter og metode","q":"Hva forteller stigningstallet på en posisjon–tid-graf?","a":"Farten med fortegn (hastighetskomponenten).","h":"Stigning på x–t → v.","t":"Ikke forveksle med arealet under grafen."},{"id":"c011","topic":"Enheter og metode","q":"Hva forteller arealet under en fart–tid-graf?","a":"Forflytningen Δx (med fortegn).","h":"Areal under v–t → Δx.","t":"Areal under fartens størrelse gir tilbakelagt strekning."},{"id":"c012","topic":"Enheter og metode","q":"Hva er forskjellen på skalare og vektorer?","a":"Skalar har størrelse. Vektor har størrelse og retning.","h":"Masse er skalar; kraft er vektor.","t":"Du må velge fortegn/retning for krefter."},{"id":"c013","topic":"Bevegelse","q":"Hva er gjennomsnittsfart med retning?","a":"v̄ = Δx/Δt.","h":"Endring i posisjon delt på tid.","t":"Forflytning er ikke alltid det samme som veilengde."},{"id":"c014","topic":"Bevegelse","q":"Hva er gjennomsnittsakselerasjon?","a":"ā = Δv/Δt.","h":"Endring i fart med retning per sekund.","t":"Negativ a betyr ikke automatisk at farten minker."},{"id":"c015","topic":"Bevegelse","q":"Hva betyr a = 0?","a":"Hastighetsvektoren er konstant.","h":"Null akselerasjon → ingen endring i v.","t":"Objektet kan fortsatt bevege seg."},{"id":"c016","topic":"Bevegelse","q":"Hva er fartsformelen ved konstant akselerasjon?","a":"v = v₀ + at.","h":"Bruk når a er konstant og tid er kjent.","t":"Kan ikke brukes ukritisk ved varierende a."},{"id":"c017","topic":"Bevegelse","q":"Hva er posisjonsformelen ved konstant akselerasjon?","a":"Δx = v₀t + ½at².","h":"Bruk når tid, startfart og akselerasjon er kjent.","t":"Δx er forflytning, ikke alltid veilengde."},{"id":"c018","topic":"Bevegelse","q":"Hvilken formel brukes når tiden mangler?","a":"v² = v₀² + 2aΔx (konstant a).","h":"Ser du startfart, sluttfart og strekning → denne.","t":"Pass på fortegnet til a og Δx."},{"id":"c019","topic":"Bevegelse","q":"Hva er akselerasjonen i fritt fall uten luftmotstand?","a":"g ≈ 9,81 m/s² nedover.","h":"Opp positiv → a = −g.","t":"Akselerasjonen endrer ikke retning i toppunktet."},{"id":"c020","topic":"Bevegelse","q":"Hva er farten i toppunktet ved rett oppkast?","a":"v = 0 et øyeblikk, men a = −g hvis opp er positiv.","h":"Fart og akselerasjon er ulike ting.","t":"Ikke skriv a = 0 i toppunktet."},{"id":"c021","topic":"Bevegelse","q":"Hvordan finner du maksimal høyde ved oppkast?","a":"Sett v = 0 i v² = v₀² + 2aΔy.","h":"Toppunkt → sluttfart 0.","t":"Velg retning før du setter inn a = −g."},{"id":"c022","topic":"Bevegelse","q":"Hva er horisontal akselerasjon i ideelt skrått kast?","a":"aₓ = 0, mens aᵧ = −g (opp positiv).","h":"Del bevegelsen i x og y.","t":"Behandle ikke skrått kast som én skalarlikning."},{"id":"c023","topic":"Bevegelse","q":"Hva forteller helningen på en v–t-graf?","a":"Akselerasjonen a.","h":"Stigning på v–t → a.","t":"Konstant fart er vannrett graf."},{"id":"c024","topic":"Bevegelse","q":"Hva forteller arealet under en a–t-graf?","a":"Fartsendringen Δv.","h":"Areal under a–t → Δv.","t":"Dette er ikke posisjonsendringen."},{"id":"c025","topic":"Krefter og statikk","q":"Hva sier Newtons 1. lov?","a":"Når ΣF = 0 er hastighetsvektoren konstant.","h":"Null netto kraft → ingen akselerasjon.","t":"Null kraft betyr ikke at v = 0."},{"id":"c026","topic":"Krefter og statikk","q":"Hva sier Newtons 2. lov?","a":"ΣF = ma.","h":"Netto kraft bestemmer akselerasjonen.","t":"Summer kreftene med fortegn."},{"id":"c027","topic":"Krefter og statikk","q":"Hva sier Newtons 3. lov?","a":"Krefter opptrer parvis: like store, motsatt rettet, på ulike legemer.","h":"A på B ↔ B på A.","t":"De to kreftene opphever ikke hverandre på ett legeme."},{"id":"c028","topic":"Krefter og statikk","q":"Hvor stor er tyngdekraften nær jordoverflaten?","a":"F_g = mg, rett ned.","h":"Masse i kg · 9,81 m/s².","t":"Tyngde (N) ≠ masse (kg)."},{"id":"c029","topic":"Krefter og statikk","q":"Hva er normalkraft?","a":"Kontaktkraften vinkelrett på flaten.","h":"Tenk kontaktflaten.","t":"N er ikke alltid lik mg."},{"id":"c030","topic":"Krefter og statikk","q":"Hva betyr at en gjenstand er i statisk likevekt?","a":"ΣFₓ = 0 og ΣFᵧ = 0 (og Στ = 0 ved rotasjon).","h":"Ingen akselerasjon.","t":"Likevekt krever også momentbalanse for utstrakte legemer."},{"id":"c031","topic":"Krefter og statikk","q":"Hva skjer med badevektvisningen i heis som akselererer opp?","a":"N = m(g + a) når opp er positiv.","h":"N − mg = ma.","t":"Bevegelse opp er ikke det samme som akselerasjon opp."},{"id":"c032","topic":"Krefter og statikk","q":"Hvordan finner du tyngdekomponenten langs skråplan?","a":"mg sin θ ned langs planet.","h":"sin = langs planet når θ er helningen.","t":"mg cos θ er komponenten vinkelrett inn i planet."},{"id":"c033","topic":"Krefter og statikk","q":"Hvordan er normalkraft på enkelt skråplan uten andre normalkrefter?","a":"N = mg cos θ (ingen akselerasjon normalt på planet).","h":"cos = vinkelrett på planet.","t":"Ikke bruk N = mg på skråplan."},{"id":"c034","topic":"Krefter og statikk","q":"Hvordan fungerer hvilefriksjon?","a":"0 ≤ |f_s| ≤ μ_s N; den tilpasser seg til maksgrensen.","h":"Hvilefriksjon er ikke automatisk maksimum.","t":"Ikke skriv alltid f_s = μ_sN."},{"id":"c035","topic":"Krefter og statikk","q":"Hvordan fungerer glidefriksjon?","a":"|f_k| = μ_k N, motsatt relativ glidning.","h":"Glir det → glidefriksjon.","t":"Retning velges etter relativ bevegelse."},{"id":"c036","topic":"Krefter og statikk","q":"Hva betyr en kraftpil i et frilegemediagram?","a":"En kraft som virker PÅ legemet du analyserer.","h":"Isoler ett legeme av gangen.","t":"Ikke tegn kreftene legemet selv utøver på andre."},{"id":"c037","topic":"Energi og effekt","q":"Hva er kinetisk energi?","a":"E_k = ½mv².","h":"Fart i andre → dobbelt fart gir 4 ganger energi.","t":"Ikke glem kvadratet."},{"id":"c038","topic":"Energi og effekt","q":"Hva er potensiell energi nær bakken?","a":"E_p = mgh relativt valgt nullnivå.","h":"Høyde → mgh.","t":"Nullnivået for h kan velges fritt."},{"id":"c039","topic":"Energi og effekt","q":"Hva er mekanisk energi?","a":"E_m = E_k + E_p (pluss eventuell fjærenergi).","h":"Bevegelse + posisjon.","t":"Ved friksjon er E_m vanligvis ikke bevart."},{"id":"c040","topic":"Energi og effekt","q":"Når kan du bruke bevaring av mekanisk energi?","a":"Når bare konservative krefter gjør arbeid på systemet.","h":"Uten friksjon/tap → E_før = E_etter.","t":"Krefter kan virke selv om mekanisk energi bevares."},{"id":"c041","topic":"Energi og effekt","q":"Hva er arbeid ved konstant kraft parallelt med bevegelsen?","a":"W = Fs.","h":"Kraft langs forflytningen gjør arbeid.","t":"Vinkel mellom kraft og bevegelse gir cos θ."},{"id":"c042","topic":"Energi og effekt","q":"Hva er arbeid med kraft i vilkårlig vinkel?","a":"W = Fs cos θ (konstant kraft).","h":"Vinkelrett kraft gjør null arbeid.","t":"θ er mellom F og forflytningen."},{"id":"c043","topic":"Energi og effekt","q":"Hva sier arbeid–energi-setningen?","a":"W_netto = ΔE_k.","h":"Netto arbeid endrer bevegelsesenergien.","t":"Ikke skriv W = ΔE_p for nettoarbeid."},{"id":"c044","topic":"Energi og effekt","q":"Hva er effekt?","a":"P = W/Δt (gjennomsnitt); ved konstant fart i kraftretning P = Fv.","h":"Arbeid per sekund.","t":"Viktig å skille W (arbeid) fra W (watt-enhet)."},{"id":"c045","topic":"Energi og effekt","q":"Hva skjer med energien ved bremsing?","a":"Kinetisk energi omformes ofte til varme via friksjon.","h":"Total energi bevares, men mekanisk energi kan minke.","t":"Ikke sett E_k før = E_k etter under bremsing."},{"id":"c046","topic":"Bevegelsesmengde","q":"Hva er bevegelsesmengde?","a":"p = mv (vektor), enhet kg·m/s.","h":"Masse · hastighet.","t":"Retningen til p er retningen til v."},{"id":"c047","topic":"Bevegelsesmengde","q":"Når bevares total bevegelsesmengde?","a":"Når den ytre impulsen på systemet er null/neglisjerbar.","h":"Kollisjon → vurder Σp før = Σp etter.","t":"Kinetisk energi bevares ikke i alle kollisjoner."},{"id":"c048","topic":"Bevegelsesmengde","q":"Hva er impuls?","a":"J = FΔt ved konstant netto kraft; generelt J = Δp.","h":"Kort stor kraft kan gi stor fartsendring.","t":"Impuls er vektor."},{"id":"c049","topic":"Bevegelsesmengde","q":"Hva er et fullstendig uelastisk støt?","a":"Legemene henger sammen etter støtet.","h":"Samme sluttfart, p bevart om isolert.","t":"Kinetisk energi er vanligvis ikke bevart."},{"id":"c050","topic":"Bevegelsesmengde","q":"Hvorfor kan du ikke bruke bare én p-likning i 2D?","a":"Bevar pₓ og pᵧ hver for seg.","h":"Del opp i komponenter.","t":"Vektorer må summeres komponentvis."},{"id":"c051","topic":"Bevegelsesmengde","q":"Hva gjør du hvis to personer skyver fra hverandre på is?","a":"Total p er fortsatt 0 om systemet startet i ro og ytre impuls er liten.","h":"Like stor og motsatt rettet p.","t":"Fartene blir ikke like hvis massene er ulike."},{"id":"c052","topic":"Svingninger","q":"Hva sier Hookes lov?","a":"F = −kx.","h":"Fjærkraft peker mot likevektsposisjonen.","t":"Minustegnet viser retning."},{"id":"c053","topic":"Svingninger","q":"Hva er perioden til en ideell fjær med masse?","a":"T = 2π√(m/k).","h":"Større masse → lengre periode.","t":"Amplituden inngår ikke i ideell modell."},{"id":"c054","topic":"Svingninger","q":"Hva er perioden til en enkel pendel ved små utslag?","a":"T = 2π√(L/g).","h":"Lengre pendel → lengre periode.","t":"Gjelder bare tilnærmet ved små vinkler."},{"id":"c055","topic":"Svingninger","q":"Hvor er farten størst i harmonisk svingning?","a":"I likevektsposisjonen.","h":"Midtpunkt → maks fart.","t":"I ytterpunkt er v = 0."},{"id":"c056","topic":"Svingninger","q":"Hva betyr amplitude?","a":"Maksimalt utslag fra likevekt.","h":"Avstand fra midtpunkt til ytterpunkt.","t":"Ikke hele avstanden mellom ytterpunkter."},{"id":"c057","topic":"Svingninger","q":"Hva er frekvens i forhold til periode?","a":"f = 1/T.","h":"Kort periode → høy frekvens.","t":"T i sekunder, f i hertz."},{"id":"c058","topic":"Væskestatikk","q":"Hva er trykk?","a":"p = F/A, enhet pascal (Pa = N/m²).","h":"Samme kraft på mindre areal gir større trykk.","t":"Trykk er ikke det samme som kraft."},{"id":"c059","topic":"Væskestatikk","q":"Hva er hydrostatisk overtrykk på dybde h?","a":"Δp = ρgh.","h":"Dypere i rolig væske → større trykk.","t":"Fullt trykk er p₀ + ρgh."},{"id":"c060","topic":"Væskestatikk","q":"Hva sier Arkimedes’ prinsipp?","a":"Oppdriften er lik tyngden av fortrengt væske.","h":"F_opp = ρ_væske g V_fortrengt.","t":"Bruk fortrengt volum, ikke alltid hele legemets volum."},{"id":"c061","topic":"Væskestatikk","q":"Når flyter et legeme i ro?","a":"Når oppdrift = tyngde, og legemet ikke synker.","h":"ΣF_y = 0.","t":"Tettheten til legemet alene bestemmer ikke neddykket volum uten flere data."},{"id":"c062","topic":"Væskestatikk","q":"Hva er tetthet?","a":"ρ = m/V, enhet kg/m³.","h":"Masse per volum.","t":"1 g/cm³ = 1000 kg/m³."},{"id":"c063","topic":"Varme og termofysikk","q":"Hva er forskjellen på varme og temperatur?","a":"Varme er energi som overføres pga. temperaturforskjell; temperatur beskriver termisk tilstand.","h":"Varme Q i J; T i K eller °C.","t":"Ikke bruk «varme» som synonym for temperatur."},{"id":"c064","topic":"Varme og termofysikk","q":"Hvordan går du fra °C til K?","a":"T(K) = T(°C) + 273,15.","h":"Bruk kelvin i gasslover.","t":"Ikke sett °C direkte i pV = nRT."},{"id":"c065","topic":"Varme og termofysikk","q":"Hva er formelen for temperaturendring uten faseovergang?","a":"Q = mcΔT når c kan regnes som konstant.","h":"Varm opp/kjøl ned → massen · spesifikk varmekapasitet · temperaturendring.","t":"ΔT i K har samme tallverdi som ΔT i °C."},{"id":"c066","topic":"Varme og termofysikk","q":"Hva er smelte- eller fordampningsvarme?","a":"Q = mL ved faseovergang.","h":"Temperaturen kan være konstant mens varme tilføres.","t":"Bruk ikke Q = mcΔT alene under faseovergangen."},{"id":"c067","topic":"Varme og termofysikk","q":"Hva er tilstandslikningen for ideell gass?","a":"pV = nRT.","h":"p i Pa, V i m³, T i K.","t":"Ikke glem absolutt temperatur."},{"id":"c068","topic":"Varme og termofysikk","q":"Hva betyr isoterm prosess?","a":"Temperaturen er konstant.","h":"iso = lik, term = temperatur.","t":"Isoterm betyr ikke at varmeoverføring er null."},{"id":"c069","topic":"Varme og termofysikk","q":"Hva betyr isokor prosess?","a":"Volumet er konstant, så volumarbeidet W = 0.","h":"Kor → volum.","t":"Trykket kan endre seg."},{"id":"c070","topic":"Varme og termofysikk","q":"Hva betyr isobar prosess?","a":"Trykket er konstant.","h":"Bar → trykk.","t":"Volum og temperatur kan endre seg."},{"id":"c071","topic":"Varme og termofysikk","q":"Hva sier termodynamikkens første lov?","a":"ΔU = Q − W, når W er arbeid systemet gjør på omgivelsene.","h":"Varme inn øker U; arbeid ut minker U.","t":"Sjekk fortegnskonvensjonen i oppgaven."},{"id":"c072","topic":"Varme og termofysikk","q":"Hva skjer vanligvis med et fast stoff som varmes opp?","a":"Det utvider seg som regel; ΔL = αL₀ΔT for liten temperaturendring.","h":"Varmere → ofte lengre.","t":"Ikke anta at alle stoffer utvider seg i alle temperaturintervall."},{"id":"c073","topic":"Elektrisitet","q":"Hva er elektrisk strøm?","a":"I = ΔQ/Δt, enhet ampere (A).","h":"Ladning per sekund.","t":"Strøm er ikke det samme som spenning."},{"id":"c074","topic":"Elektrisitet","q":"Hva er spenning?","a":"Energi per ladning: U = W/Q, enhet volt (V = J/C).","h":"Spenning forteller hvor mye energi en ladning kan få eller avgi.","t":"Ikke bland U (spenning) og J (joule)."},{"id":"c075","topic":"Elektrisitet","q":"Hva er Ohms lov?","a":"U = RI (for en ohmsk komponent).","h":"Spenning = resistans · strøm.","t":"Alle elektriske komponenter er ikke ohmske."},{"id":"c076","topic":"Elektrisitet","q":"Hva er elektrisk effekt?","a":"P = UI; for motstand også P = I²R = U²/R.","h":"Elektrisk energi per sekund.","t":"Bruk riktig spenning og strøm for samme komponent."},{"id":"c077","topic":"Elektrisitet","q":"Hvordan kombinerer du motstander i serie?","a":"R_total = R₁ + R₂ + …; samme strøm gjennom alle.","h":"Serie → strøm lik.","t":"Spenningen fordeles."},{"id":"c078","topic":"Elektrisitet","q":"Hvordan kombinerer du motstander i parallell?","a":"1/R_total = 1/R₁ + 1/R₂ + …; samme spenning.","h":"Parallell → spenning lik.","t":"Totalmotstanden blir mindre enn minste enkeltmotstand."},{"id":"c079","topic":"Elektrisitet","q":"Hva skjer med strøm i en seriekrets når R øker ved konstant U?","a":"Strømmen I = U/R minker.","h":"Fast spenning → mer motstand, mindre strøm.","t":"Resistans må måles i ohm."},{"id":"c080","topic":"Elektrisitet","q":"Hva sier Kirchhoffs knuteregel?","a":"Strøm inn i et knutepunkt = strøm ut.","h":"Ladning hoper seg ikke opp i en ideell stasjonær knute.","t":"Regn med retninger og fortegn."},{"id":"c081","topic":"Elektrisitet","q":"Hva sier Kirchhoffs sløyferegel?","a":"Summen av spenningsendringer rundt en lukket sløyfe er 0.","h":"Energi per ladning går opp og ned til samme nivå.","t":"Ta med spenningsfall med fortegn."},{"id":"c082","topic":"Elektrisitet","q":"Hvordan regner du elektrisk energibruk?","a":"E = Pt, for konstant effekt.","h":"1 kWh = 3,6 MJ.","t":"kWh er energi, ikke effekt."},{"id":"c083","topic":"Atom og stråling","q":"Hva består atomkjernen av?","a":"Protoner og nøytroner.","h":"Elektroner finnes rundt kjernen.","t":"Atomnummer Z er antall protoner."},{"id":"c084","topic":"Atom og stråling","q":"Hva er isotoper?","a":"Samme antall protoner, ulikt antall nøytroner.","h":"Samme grunnstoff → samme Z.","t":"Massentallet A = protoner + nøytroner."},{"id":"c085","topic":"Atom og stråling","q":"Hva er alfastråling?","a":"Heliumkjerner: 2 protoner + 2 nøytroner.","h":"Alfa: stor partikkel, kort rekkevidde.","t":"Kjernen får Z − 2 og A − 4 ved alfa-henfall."},{"id":"c086","topic":"Atom og stråling","q":"Hva er betaminusstråling?","a":"Et elektron sendes ut når et nøytron omdannes til proton.","h":"β⁻: Z øker med 1, A uendret.","t":"Det er ikke et elektron som bare løsner fra elektronskallet."},{"id":"c087","topic":"Atom og stråling","q":"Hva er gammastråling?","a":"Høyenergetisk elektromagnetisk stråling fra kjernen.","h":"Gamma: foton, uten ladning eller masse i hvile.","t":"Z og A endres ikke ved ren gammaemisjon."},{"id":"c088","topic":"Atom og stråling","q":"Hva betyr halveringstid?","a":"Tiden det tar før mengden av radioaktive kjerner er halvert i gjennomsnitt.","h":"Etter 2 halveringstider gjenstår 1/4.","t":"Ikke trekk fra samme antall kjerner hver gang."},{"id":"c089","topic":"Atom og stråling","q":"Hva er formelen for radioaktivt henfall?","a":"N(t) = N₀ · (1/2)^(t/T½).","h":"Antall halveringer = t/T½.","t":"Eksponenten gjelder hele forholdet t/T½."},{"id":"c090","topic":"Atom og stråling","q":"Hva er aktivitet til et radioaktivt stoff?","a":"A = λN, måles i becquerel (Bq = henfall/s).","h":"Flere kjerner → vanligvis større aktivitet.","t":"Bq måler ikke mottatt stråledose."},{"id":"c091","topic":"Atom og stråling","q":"Hva er forskjellen på Bq, Gy og Sv?","a":"Bq = henfall/s. Gy = absorbert energi/kg. Sv = biologisk vektet dose.","h":"Aktivitet ≠ absorbert dose ≠ risikojustert dose.","t":"Ikke sammenlign størrelsene som samme enhet."},{"id":"c092","topic":"Atom og stråling","q":"Hva betyr E = hf for lys?","a":"Energien til ett foton er Plancks konstant ganger frekvens.","h":"Høyere frekvens → mer energi per foton.","t":"Lysstyrke handler også om antall fotoner."},{"id":"c093","topic":"Forsøk og modellering","q":"Hva må en fysikkrapport minst vise?","a":"Problemstilling, metode, målinger, beregninger, drøfting og konklusjon.","h":"Vær tydelig på enheter og usikkerhet.","t":"Bare et svar uten metode er sjelden tilstrekkelig."},{"id":"c094","topic":"Forsøk og modellering","q":"Hva betyr måleusikkerhet?","a":"Et anslag for hvor presist målingen beskriver størrelsen.","h":"Oppgi måleverdi med passende siffer og enhet.","t":"Ikke oppgi flere sikre siffer enn målingen tåler."},{"id":"c095","topic":"Forsøk og modellering","q":"Hva er en idealisert modell?","a":"En forenkling som beskriver sentrale forhold i virkeligheten.","h":"Fritt fall uten luftmotstand er en modell.","t":"Vurder om modellforutsetningene passer."},{"id":"c096","topic":"Forsøk og modellering","q":"Hva betyr stigningstall på en s–t-graf ved rettlinjet bevegelse?","a":"Hastighet: v = Δs/Δt for rett graf.","h":"Bruk helningen, ikke høyden på grafen.","t":"Kurvet graf → bare gjennomsnitt på et intervall."},{"id":"c097","topic":"Forsøk og modellering","q":"Hvorfor bruker vi enheter i alle mellomregninger?","a":"Enheter gjør det lettere å se feil formler og omregninger.","h":"Enhetskontroll er siste kvalitetskontroll.","t":"Ikke stryk enheter for tidlig."}];
const TOPICS = [...new Set(CARDS.map(c=>c.topic))];
const STORAGE_KEY='fysikk-hvl-for034-progress-v1';
let progress={},view='home',topic='Alle',search='',deck=[],at=0,flipped=false,sessionRight=0,sessionWrong=0,sessionName='',libraryQuery='';
try {progress=JSON.parse(localStorage.getItem(STORAGE_KEY)||'{}')} catch(e){progress={}};
const byId=Object.fromEntries(CARDS.map(c=>[c.id,c]));
const app=document.getElementById('app');
const escapeHTML=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const save=()=>{try{localStorage.setItem(STORAGE_KEY,JSON.stringify(progress))}catch(e){}};
const seen=c=>progress[c.id]&&progress[c.id].rating;
const hard=c=>seen(c)==='hard';
const known=c=>seen(c)==='known';
const fav=c=>!!(progress[c.id]&&progress[c.id].fav);
const subject=()=>CARDS.filter(c=>topic==='Alle'||c.topic===topic);
const rand=arr=>{let a=[...arr];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const summary=()=>({known:CARDS.filter(known).length,hard:CARDS.filter(hard).length,seen:CARDS.filter(c=>!!seen(c)).length});
function showView(v){view=v;render();window.scrollTo({top:0,behavior:'auto'})}
function switchTopic(t){topic=t;render()}
function startSession(mode){
 let pool=subject(),count=10;
 if(mode==='quick'){count=5;pool=rand(pool).sort((a,b)=>(hard(b)?1:0)-(hard(a)?1:0) || (!seen(b)?1:0)-(!seen(a)?1:0));sessionName='5 raske'}
 else if(mode==='topic'){count=10;pool=rand(pool);sessionName='10 fra tema'}
 else if(mode==='hard'){pool=rand(pool.filter(hard));count=pool.length;sessionName='Øv vanskelige'}
 else if(mode==='fav'){pool=rand(pool.filter(fav));count=pool.length;sessionName='Stjernemerkede'}
 else if(mode==='all'){pool=rand(pool);count=pool.length;sessionName='Alle valgte kort'}
 deck=pool.slice(0,count).map(c=>({id:c.id,retry:0}));
 if(deck.length===0){alert('Ingen kort passer ennå. Prøv et annet tema eller merk noen kort.');return}
 at=0;flipped=false;sessionRight=0;sessionWrong=0;showView('study');
}
function toggleFlip(){flipped=!flipped;render()}
function rate(r){if(!flipped || at>=deck.length)return;const entry=deck[at],id=entry.id;
 progress[id]={...(progress[id]||{}),rating:r,right:(progress[id]?.right||0)+(r==='known'?1:0),wrong:(progress[id]?.wrong||0)+(r==='hard'?1:0),last:Date.now()};save();
 if(r==='hard'){sessionWrong++;if(entry.retry===0){deck.push({id,retry:1})}}
 else{sessionRight++}
 at++;flipped=false;render();window.scrollTo({top:0,behavior:'auto'})}
function toggleStar(){const id=deck[at]?.id;if(!id)return;progress[id]={...(progress[id]||{}),fav:!progress[id]?.fav};save();render()}
const cardPage=()=>{
 if(at>=deck.length) return `<div class="hero panel"><div class="smallcaps">Økten fullført</div><h1>Godt jobbet!</h1><p class="lede">Du svarte «kan det» ${sessionRight} ganger og «øv mer» ${sessionWrong} ganger. Vanskelige kort ble vist på nytt én gang.</p><div class="actions"><button class="primary" onclick="startSession('quick')">Ta 5 nye</button><button class="secondary" onclick="showView('home')">Tilbake</button></div></div>`;
 const c=byId[deck[at].id],pct=Math.round(100*at/deck.length);
 return `<div class="study-toolbar"><button class="outline" onclick="showView('home')">← Avslutt</button><span class="label-pill">${escapeHTML(sessionName)} · ${at+1}/${deck.length}</span><button class="star" aria-label="Stjernemerk kort" title="Stjernemerk" onclick="toggleStar()">${fav(c)?'★':'☆'}</button></div><div class="progressbar"><div class="progressfill" style="width:${pct}%"></div></div>
 <article class="panel cardbox cardclick" role="button" tabindex="0" aria-label="${flipped?'Vis spørsmålet':'Vis svaret'}" onclick="toggleFlip()" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();toggleFlip()}">
 ${flipped?`<div class="cardlabel">Svar · ${escapeHTML(c.topic)}</div><div class="answer">${escapeHTML(c.a)}</div><div class="answer-extra"><b>💡 HUSKEREGEL</b><p>${escapeHTML(c.h)}</p></div><div class="answer-extra warn"><b>⚠ VANLIG FEIL</b><p>${escapeHTML(c.t)}</p></div>`:`<div class="cardlabel">Spørsmål · ${escapeHTML(c.topic)}</div><div class="question">${escapeHTML(c.q)}</div><span class="muted tiny">Trykk på kortet for å se svaret</span>`}</article>
 ${flipped?`<div class="feedback"><button class="secondary rate-no" onclick="rate('hard')">× Øv mer</button><button class="primary rate-yes" onclick="rate('known')">✓ Kan det</button></div>`:`<button class="primary full" style="margin-top:14px" onclick="toggleFlip()">Vis svar</button>`}
 <p class="under-card">${flipped?'Vurder om du kunne svaret før du så fasiten.':'Å hente svaret fra hukommelsen gir bedre repetisjon enn å bare lese.'}</p>`;
};
function homePage(){let s=summary(),n=subject().length,hardCount=subject().filter(hard).length,favCount=subject().filter(fav).length;
 return `<section class="hero panel"><div class="smallcaps">Øving på 2–5 minutter</div><h1>Litt fysikk.<br>Hver dag.</h1><p class="lede">97 huskekort fra emneplanen i HVL FOR034. Spørsmål → tenk selv → vis svar → vurder deg selv. Alt fungerer uten nett.</p><div class="actions"><button class="primary" onclick="startSession('quick')">⚡ 5 raske kort</button><button class="secondary" onclick="startSession('topic')">🎯 10 fra tema</button><button class="secondary" onclick="startSession('hard')" ${hardCount?'':'disabled'}>↻ Vanskelige (${hardCount})</button></div></section>
 <section class="stats" aria-label="Fremgang"><div class="stat"><strong>${s.seen}</strong><span>Øvd minst én gang</span></div><div class="stat"><strong>${s.known}</strong><span>Kan nå</span></div><div class="stat"><strong>${s.hard}</strong><span>Øv mer</span></div></section>
 <div class="sectionhead"><h2>Velg tema</h2><span class="count">${n} kort</span></div><div class="filter-row" role="group" aria-label="Velg fagtema">${['Alle',...TOPICS].map(t=>`<button class="chip ${t===topic?'active':''}" aria-pressed="${t===topic}" onclick="switchTopic('${escapeHTML(t)}')">${escapeHTML(t)}${t==='Alle'?'':` · ${CARDS.filter(c=>c.topic===t).length}`}</button>`).join('')}</div>
 <div class="topic-summary panel"><div class="tiprow"><div><div class="smallcaps">Dagens fokus</div><strong>${topic==='Alle'?'Hele FOR034-pensumet':escapeHTML(topic)}</strong></div><span class="label-pill">${n} kort</span></div><p>${topic==='Alle'?'Start gjerne med Enheter og metode, Bevegelse og Krefter og statikk. Ta resten etter hvert som dere kommer til dem på forelesning.':'Ta fem korte spørsmål nå, eller alle når du har bedre tid.'}</p><div class="actions" style="margin-top:14px"><button class="secondary" onclick="startSession('all')">Øv alle (${n})</button><button class="outline" onclick="startSession('fav')" ${favCount?'':'disabled'}>★ Mine stjerner (${favCount})</button></div></div>
 <div class="hint-strip"><b>Tips til høstprøven:</b> Prioriter først fart/akselerasjon, kraftdiagram, Newtons lover og SI-enheter. Dette er en anbefalt grunnmur, ikke en påstand om hva som kommer på prøven.</div>`
}
const FORMULAS=[
 ['Start på 20 sekunder','Kjent → ukjent → tegning → lov → regn → sjekk','1) Hva finner jeg? 2) Skriv SI-enheter. 3) Velg positiv retning. 4) Tegn kreftene. 5) Sjekk at svaret gir mening.'],
 ['Bevegelse','v = v₀ + at · Δx = v₀t + ½at²','Gjelder bare ved konstant akselerasjon. Uten tid: v² = v₀² + 2aΔx.'],
 ['Toppunkt ved loddrett kast','v = 0, men a = −g','Velg opp som positiv. Gravitasjonen virker nedover hele tiden.'],
 ['Newtons 2. lov','ΣF = ma','Tegn alle krefter PÅ legemet. Velg akser og summer komponentene.'],
 ['Tyngde og skråplan','F_g = mg · F_langs = mg sin θ','På enkelt skråplan: F_normalt = mg cos θ. N er ikke alltid mg.'],
 ['Friksjon','|f_s| ≤ μ_sN · |f_k| = μ_kN','Hvilefriksjon tilpasser seg; glidefriksjon gjelder når det glir.'],
 ['Energi','E_k = ½mv² · E_p = mgh','Uten tap: E_før = E_etter. Med friksjon: bruk arbeid og energiregnskap.'],
 ['Arbeid og effekt','W = Fs cos θ · P = W/t','Arbeid måles i J; effekt i W = J/s.'],
 ['Støt og impuls','p = mv · J = Δp','Ved neglisjerbar ytre impuls: Σp_før = Σp_etter, komponent for komponent.'],
 ['Fjær og pendel','F = −kx · T_fjær = 2π√(m/k)','For enkel pendel ved små vinkler: T = 2π√(L/g).'],
 ['Trykk og oppdrift','p = F/A · Δp = ρgh','Oppdrift: F_opp = ρ_væske · g · V_fortrengt.'],
 ['Varme og gass','Q = mcΔT · pV = nRT','Ved faseovergang: Q = mL. Bruk K i gassloven.'],
 ['Termodynamikk','ΔU = Q − W','Her er W arbeid gjort av gassen/systemet. Sjekk fortegn.'],
 ['Kretser','U = RI · P = UI','Serie: samme I, R summeres. Parallell: samme U, 1/R summeres.'],
 ['Radioaktivitet','N = N₀(½)^(t/T½)','Etter 1, 2, 3 halveringstider: ½, ¼, ⅛ igjen.'],
 ['Atomfysikk','E_foton = hf','Isotoper har samme antall protoner, ulikt antall nøytroner.'],
];
function formulaPage(){return `<div class="smallcaps">Lynark · første repetisjon</div><h1>Hvis du ser X,<br>tenk Y.</h1><p class="lede">Dette er snarveien når du bare har ett minutt. Trykk «Hjem» for å øve med spørsmål.</p><div class="formulalist">${FORMULAS.map(([t,f,desc])=>`<section class="panel formula"><h3>${escapeHTML(t)}</h3><div class="eq">${escapeHTML(f)}</div><p>${escapeHTML(desc)}</p></section>`).join('')}</div>`}
function libraryPage(){const term=libraryQuery.trim().toLocaleLowerCase('nb');const shown=subject().filter(c=>!term || (c.q+' '+c.a+' '+c.h+' '+c.t+' '+c.topic).toLocaleLowerCase('nb').includes(term));return `<div class="smallcaps">Kortbibliotek</div><h1>Alle huskekort</h1><p class="lede">Søk etter «friksjon», «gass» eller en formel. Åpne et kort for et raskt svar.</p><input id="search-library" class="search" type="search" value="${escapeHTML(libraryQuery)}" oninput="libraryQuery=this.value;updateLibraryResults()" placeholder="Søk i alle kort…" autocomplete="off" aria-label="Søk i huskekort"><div class="count" id="library-count" style="margin-bottom:11px"></div><div id="library-results"></div>`}
function updateLibraryResults(){const term=libraryQuery.trim().toLocaleLowerCase('nb');const shown=subject().filter(c=>!term||(c.q+' '+c.a+' '+c.h+' '+c.t+' '+c.topic).toLocaleLowerCase('nb').includes(term));document.getElementById('library-count').textContent=`${shown.length} av ${subject().length} kort i valgt tema`;
 document.getElementById('library-results').innerHTML=shown.map(c=>`<details class="library-item"><summary>${escapeHTML(c.q)} ${known(c)?'<span title="Kan">✓</span>':hard(c)?'<span title="Øv mer">↻</span>':''}</summary><p>${escapeHTML(c.a)}</p><div class="mini-note"><b>Husk:</b> ${escapeHTML(c.h)}</div><div class="mini-note"><b>Unngå:</b> ${escapeHTML(c.t)}</div></details>`).join('')||'<p class="muted">Ingen kort funnet i dette temaet.</p>'}
function settingsPage(){return `<div class="smallcaps">Helt uten konto</div><h1>Dine innstillinger</h1><section class="settings-item"><h3>Fremgangen lagres på denne enheten</h3><p>Ingen innlogging, sporing eller server. Resultatene lagres lokalt i nettleseren. De kan bli borte hvis nettleserdata slettes, eller hvis du åpner appen fra en annen adresse.</p><div class="setting-actions"><button class="secondary" onclick="exportProgress()">↓ Eksporter fremgang</button><button class="outline" onclick="document.getElementById('importFile').click()">↑ Importer</button><input type="file" accept="application/json,.json" id="importFile" hidden onchange="importProgress(event)"></div></section>
 <section class="settings-item"><h3>Installer på iPhone</h3><p>Når nettsiden ligger på en HTTPS-adresse, åpne den i Safari. Trykk Del → Legg til på Hjem-skjerm. Åpne den én gang mens du er på nett for å fylle offline-hurtigminnet.</p><div class="callout">En enkelt nedlastet HTML-fil kan også brukes offline i en nettleser som åpner lokale HTML-filer, men iPhone sin Filer-forhåndsvisning kjører ikke alltid alle funksjonene.</div></section>
 <section class="settings-item"><h3>Nullstill øvingsresultater</h3><p>Dette sletter merkingene dine for «Kan det», «Øv mer» og stjerner på denne enheten.</p><button class="outline" onclick="resetProgress()">Nullstill alt</button></section>
 <section class="settings-item"><h3>Om innholdet</h3><p>97 egenformulerte kort etter temaene i HVL FOR034 (2026/2027). Ikke en offisiell HVL-app eller en verifisert frekvensanalyse av tidligere HVL-eksamener. Prioriter forelesninger, bok og arbeidskrav ved avvik.</p><a href="https://www.hvl.no/studier/studieprogram/emne/for034/" target="_blank" rel="noopener">HVLs offisielle emneplan ↗</a></section>`}
function exportProgress(){const blob=new Blob([JSON.stringify({format:'hvl-fysikk-1',exported:new Date().toISOString(),progress},null,2)],{type:'application/json'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='fysikk-fremgang.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
function importProgress(event){const f=event.target.files?.[0];if(!f)return;const reader=new FileReader();reader.onload=()=>{try{const obj=JSON.parse(reader.result);if(obj.format!=='hvl-fysikk-1'||typeof obj.progress!=='object'||Array.isArray(obj.progress))throw new Error('Feil filformat');progress=Object.fromEntries(Object.entries(obj.progress).filter(([id,val])=>byId[id]&&val&&typeof val==='object').map(([id,val])=>[id,{rating:['hard','known'].includes(val.rating)?val.rating:undefined,right:Math.max(0,Number(val.right)||0),wrong:Math.max(0,Number(val.wrong)||0),fav:!!val.fav,last:Number(val.last)||0}]));save();alert('Fremgangen ble importert.');render()}catch(e){alert('Kunne ikke lese fremgangsfilen.')}};reader.readAsText(f)}
function resetProgress(){if(!confirm('Vil du slette all lokal fremgang?'))return;progress={};save();showView('home')}
function render(){document.querySelectorAll('.navbtn').forEach(b=>b.classList.toggle('active',b.id===('nav-'+(view==='study'?'home':view))));app.innerHTML=view==='home'?homePage():view==='study'?cardPage():view==='formulas'?formulaPage():view==='library'?libraryPage():settingsPage();if(view==='library')updateLibraryResults()}
document.addEventListener('keydown',e=>{if(view!=='study'||['INPUT','TEXTAREA'].includes(document.activeElement.tagName))return;if(e.key==='ArrowRight'){e.preventDefault();if(!flipped)toggleFlip();else rate('known')}if(e.key==='ArrowLeft'&&flipped){e.preventDefault();rate('hard')}});
render();
if('serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('./sw.js').catch(()=>{});
window.addEventListener('online',()=>document.getElementById('online-label').textContent='Fungerer offline');
window.addEventListener('offline',()=>document.getElementById('online-label').textContent='Uten nett ✓');
if(!navigator.onLine)document.getElementById('online-label').textContent='Uten nett ✓';
</script>
